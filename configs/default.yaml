project:
  name: tiantan-glioma-rn-vs-recur
  seed: 442
  output_dir: ./outputs

data:
  raw_root: ./data/raw
  processed_root: ./data/processed
  modalities: [t1, t1ce, t2, flair]
  patch_size: [128, 128, 128]
  use_2d_slices: false
  slice_axis: 2
  train_val_test_split: [0.7, 0.15, 0.15]
  resample_spacing: [1.0, 1.0, 1.0]
  intensity_norm: zscore_foreground

cleaning:
  drop_missing_modalities: true
  min_lesion_voxels: 50
  bias_field_correction: true
  skull_strip: false
  registration_target: t1ce

imbalance:
  strategy: weighted_sampler
  positive_label: recurrence
  negative_label: necrosis

model:
  in_channels: 4
  num_classes: 2
  base_channels: 32
  use_prior_modules: true
  prior_modules: [parameter_sharing, topology_aware, dynamics]
  segmentation_head: true
  classification_head: true
  deep_supervision: true

loss:
  cls_loss: focal
  seg_loss: dice_ce
  prior_consistency_weight: 0.1
  ds_weights: [1.0, 0.4, 0.3, 0.2]
  class_weights: [1.0, 1.0]

train:
  batch_size: 2
  num_workers: 4
  epochs: 200
  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine
  warmup_epochs: 5
  amp: true
  grad_clip: 1.0

eval:
  metrics: [accuracy, auc, f1, sensitivity, specificity, dice]
  save_predictions: true
