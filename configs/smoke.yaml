project:
  name: nr-subproject-smoke
  seed: 442
  output_dir: ./nr_subproject/outputs/smoke

data:
  train_root: ./data1/NR数据/训练集复发胶质瘤与放射性坏死原始影像资料（以患者为单位）
  val_root: ./data1/NR数据/验证集放射性坏死原始数据（标注后）
  labels_csv: ./nr_subproject/labels.csv
  processed_dir: ./nr_subproject/processed
  modalities: [t1, t1ce, t2, flair]
  patch_size: [64, 64, 64]
  resample_spacing: [1.0, 1.0, 1.0]
  intensity_norm: zscore_foreground

preprocess:
  drop_if_no_modalities: true
  drop_if_missing_modality: false
  zscore_foreground: true
  fg_threshold: 0.0

imbalance:
  strategy: weighted_sampler
  positive_label: recurrence
  negative_label: necrosis

model:
  in_channels: 4
  num_classes: 2
  seg_classes: 3
  base_channels: 16
  stem_channels: 16
  deep_supervision: true
  use_modality_prior: true
  use_topology_prior: true
  use_anatomy_prior: true
  aux_dim: 4
  modality_dropout_p: 0.0

loss:
  focal_alpha: 0.25
  focal_gamma: 2.0
  seg_focal_alpha: 0.25
  seg_focal_gamma: 2.0
  cls_weight: 1.0
  seg_weight: 1.0
  log_volume_weight: 0.5
  nesting_weight: 0.1
  chi_weight: 0.05
  class_chi: {0: -24.0, 1: 4.0}
  default_chi: -3.0
  ds_weights: [1.0, 0.4, 0.3]
  class_weights: null
  seg_channel_weights: null

train:
  batch_size: 1
  num_workers: 0
  epochs: 2
  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-5
  betas: [0.9, 0.999]
  scheduler: warmup_cosine
  warmup_epochs: 1
  amp: false
  grad_clip: 1.0
  early_stop_patience: 30
  use_ema: false
  ema_decay: 0.999

eval:
  metrics: [accuracy, auc, f1, sensitivity, specificity, dice]
  save_predictions: true
